name: Build Tweaks (Theos) and Rebuild APT Index

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "tweak-build"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        tweak: [Glint, ActionButton12, Aura, Echo, Volt, Lumina, Cam60Enabler5s]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot dpkg-dev gzip bzip2 xz-utils rsync curl ca-certificates perl libxml2 libtinfo6 zip git

      - name: Install ldid
        run: |
          case "$(uname -m)" in
            x86_64) ASSET=ldid_linux_x86_64 ;;
            aarch64) ASSET=ldid_linux_aarch64 ;;
            *) echo "Unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          for i in 1 2 3 4 5; do
            if curl -fsSL -o /tmp/ldid "https://github.com/ProcursusTeam/ldid/releases/latest/download/$ASSET"; then break; fi
            echo "ldid download retry $i"
            sleep 10
          done
          test -s /tmp/ldid
          sudo install -m 755 /tmp/ldid /usr/local/bin/ldid
          which ldid

      - name: Install Theos (no GitHub API)
        run: |
          export THEOS="$HOME/theos"
          for i in 1 2 3; do
            if git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"; then break; fi
            rm -rf "$THEOS"
            sleep 10
          done
          mkdir -p "$THEOS/toolchain"
          for i in 1 2 3; do
            if curl -fsSL -o /tmp/toolchain.tar.xz "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz"; then break; fi
            echo "toolchain download retry $i"
            sleep 10
          done
          tar -xJ -C "$THEOS/toolchain/" -f /tmp/toolchain.tar.xz
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS 12.4 SDK
        run: |
          for i in 1 2 3; do
            rm -rf /tmp/sdks
            if git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks; then break; fi
            echo "SDK clone retry $i"
            sleep 10
          done
          mkdir -p "$THEOS/sdks"
          test -d /tmp/sdks/iPhoneOS12.4.sdk
          cp -a /tmp/sdks/iPhoneOS12.4.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Build ${{ matrix.tweak }}
        run: |
          cd "tweaks/${{ matrix.tweak }}"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_COMPRESSION=gzip THEOS_PACKAGE_FORMAT=gnu
          mkdir -p ../../debs-new
          cp -v ./packages/*.deb ../../debs-new/
          ls -la ../../debs-new

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.tweak }}
          path: debs-new/*.deb
          if-no-files-found: error

  apt-index:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built debs
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: debs-new

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip bzip2 xz-utils

      - name: Rebuild Packages index
        run: |
          set -e
          cp -v debs-new/*.deb debs/
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -c Packages > Packages.gz
          bzip2 -c Packages > Packages.bz2
          xz -c Packages > Packages.xz
          echo "--- Packages summary ---"
          grep -E "^(Package|Version|Filename):" Packages

      - name: Regenerate Release file
        run: |
          set -e
          {
            head -n 8 Release
            echo "MD5Sum:"
            for f in Packages Packages.gz Packages.bz2 Packages.xz; do
              printf ' %s %s %s\n' "$(md5sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$f"
            done
            echo "SHA1:"
            for f in Packages Packages.gz Packages.bz2 Packages.xz; do
              printf ' %s %s %s\n' "$(sha1sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$f"
            done
            echo "SHA256:"
            for f in Packages Packages.gz Packages.bz2 Packages.xz; do
              printf ' %s %s %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$f"
            done
          } > Release.tmp
          mv Release.tmp Release
          cat Release

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debs Packages Packages.gz Packages.bz2 Packages.xz Release
          if git diff --cached --quiet; then
            echo "No index changes to commit"
          else
            git commit -m "CI: add newly built debs and rebuild APT index [skip ci]"
            git push
          fi

      - name: Trigger Pages deploy
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" -f ref=main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
